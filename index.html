<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Clickable concept prototype of Art-Science Europe, the European Art-Science-Tech Platform for Climate Transformation. Example content only.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Art-Science Europe Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a "guide + screen" split taken from the pitch deck. Left, a quiet guide column explains the view; right, the platform itself, fully clickable. One light, green world (deliberately single-theme, per Anke). */
:root{
  --paper:#F5F8F2; --mint:#E6F0E8; --panel:#FDFEFC; --wash:#EBF3ED;
  --ink:#15322B; --ink-soft:#4B615A; --muted:#5E7169; --line:#D3E2D6; --line-strong:#9DBFA8;
  --green:#2F7A57; --green-deep:#235F43; --leaf:#BFE0C9;
  --art:#B8863B; --art-bg:#F3E3C0; --art-ink:#6B4B14;
  --sci:#2F5D8A; --sci-bg:#DCE7F2; --sci-ink:#234A70;
  --tech:#337A6A; --tech-bg:#D5EBE5; --tech-ink:#245A4D;
  --soc:#A5533F; --soc-bg:#F2DDD5; --soc-ink:#7A3727;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --text:"Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --shadow:0 18px 44px -18px rgba(21,50,43,.28), 0 2px 6px rgba(21,50,43,.06);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--leaf);color:var(--ink)}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:6px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--green);text-underline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
p{margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1320px;margin:0 auto}

/* Prototype ribbon */
.ribbon{background:var(--ink);color:#E4EFE7;font-size:12.5px;letter-spacing:.02em}
.ribbon .inner{display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:38px;flex-wrap:wrap;padding-block:6px}
.ribbon b{color:var(--leaf);font-weight:600}
.ribbon .actions{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(191,224,201,.4);color:#E4EFE7;border-radius:999px;padding:4px 12px;font-size:12.5px;transition:background .2s}
.chipbtn:hover{background:rgba(191,224,201,.14)}
.chipbtn svg{width:14px;height:14px}

/* App bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(245,248,242,.92);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.appbar .inner{display:flex;align-items:center;gap:20px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand-mark{width:30px;height:30px}
.brand-name{font-family:var(--display);font-size:22px;font-weight:500;line-height:1}
.brand-sub{display:block;font-family:var(--text);font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.nav::-webkit-scrollbar{display:none}
.nav button{white-space:nowrap;padding:8px 11px;border-radius:999px;font-size:14px;color:var(--ink-soft);transition:background .2s,color .2s}
.nav button:hover{background:var(--mint);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--paper)}
.me{flex:none;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.me .av{width:34px;height:34px;font-size:15px}

/* Shell */
.shell{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:40px;padding-block:36px 64px;align-items:start}
.guide{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);display:flex;flex-direction:column;gap:18px}
.guide h1{hyphens:manual;-webkit-hyphens:manual;font-size:clamp(38px,3.9vw,56px);font-weight:400;letter-spacing:-.02em}
.guide .lede{font-size:17px;line-height:1.55;color:var(--ink-soft);max-width:34ch}
.guide .steps{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.guide .step{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.guide .step i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--green);color:var(--paper);display:grid;place-items:center;font-size:12.5px;font-weight:600}
.guide .step b{display:block;font-weight:600;font-size:14.5px}
.guide .step span{color:var(--ink-soft);font-size:14px}
.try{background:var(--mint);border-radius:var(--r-m);padding:14px 16px;font-size:14px;color:var(--ink);display:flex;gap:10px}
.try svg{flex:none;width:18px;height:18px;color:var(--green);margin-top:2px}
.guide-foot{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.tourbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tourbar .btn-dark{white-space:normal;text-align:left}
.tourbar .count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:auto;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 18px;font-weight:500;font-size:14px;transition:background .2s,transform .2s var(--ease),box-shadow .2s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-dark{background:var(--ink);color:var(--paper)}
.btn-dark:hover{background:#0E2620}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-deep)}
.btn-line{border:1.5px solid var(--ink);color:var(--ink);padding:8.5px 16.5px}
.btn-line:hover{background:var(--mint)}
.btn-ghost{color:var(--ink-soft);padding:8px 10px}
.btn-ghost:hover{color:var(--ink);background:var(--mint)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default}
.feedback-note{font-size:12.5px;color:var(--muted)}

/* Screen (the platform window) */
.screen{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.screen-bar{height:44px;background:var(--wash);display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line)}
.screen-bar i{width:11px;height:11px;border-radius:50%;background:#C2D6C8}
.screen-bar span{margin-left:10px;font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen-bar em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap}
.view{padding:28px;display:flex;flex-direction:column;gap:24px;min-width:0}
.view.enter{animation:enter .55s var(--ease)}
.view>*{min-width:0;max-width:100%}
.hero .copy,.hero .search{max-width:min(560px,100%)}
@keyframes enter{from{opacity:.001;transform:translateY(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}

/* Shared bits */
.av{border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;color:var(--paper);flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:500;white-space:nowrap}
.t-art{background:var(--art-bg);color:var(--art-ink)} .t-sci{background:var(--sci-bg);color:var(--sci-ink)}
.t-tech{background:var(--tech-bg);color:var(--tech-ink)} .t-soc{background:var(--soc-bg);color:var(--soc-ink)}
.t-inst{background:var(--wash);color:var(--ink);border:1px solid var(--line)} .t-res{background:var(--mint);color:var(--green-deep)}
.search{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--green);border-radius:999px;padding:0 8px 0 20px;min-height:56px}
.search svg{width:20px;height:20px;color:var(--green);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;padding:14px 0}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:6px 14px;font-size:13.5px;background:var(--mint);color:var(--ink-soft);border:1px solid transparent;transition:background .2s,color .2s}
.chip:hover{color:var(--ink);border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.label{font-size:12.5px;font-weight:600;color:var(--green);letter-spacing:.01em}
.hsec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hsec h2{font-size:30px}
.hsec .more{font-size:13.5px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{padding:0 2px 10px;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-color:var(--green)}
.box{border:1px solid var(--line);border-radius:var(--r-m);background:#fff}
.icon{width:18px;height:18px;flex:none}
.muted{color:var(--muted)} .soft{color:var(--ink-soft)}
.example{font-size:12px;color:var(--muted)}

/* Home */
.hero{position:relative;border-radius:var(--r-m);overflow:hidden;background:linear-gradient(135deg,#F7FAF5 0%,#E2F0E7 55%,#D4E9EC 100%);padding:40px 36px 36px;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;gap:16px}
.hero svg.art{position:absolute;right:-60px;top:-30px;width:68%;height:auto;pointer-events:none}
.hero .copy{position:relative;display:flex;flex-direction:column;gap:14px;max-width:560px}
.hero h2{font-size:clamp(40px,5vw,64px);font-weight:400;letter-spacing:-.02em}
.hero .claim{font-family:var(--display);font-style:italic;font-size:22px;color:var(--ink-soft);line-height:1.3}
.hero .search{max-width:560px;position:relative;box-shadow:0 10px 30px -14px rgba(21,50,43,.35)}
.areas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line)}
.area{display:flex;flex-direction:column;gap:8px;padding:18px 16px 18px 0;text-align:left;border-right:1px solid var(--line);margin-right:16px;transition:transform .25s var(--ease)}
.area:last-child{border-right:0;margin-right:0}
.area:hover{transform:translateY(-2px)}
.area:hover h3{color:var(--green)}
.area .dot{width:10px;height:10px;border-radius:50%}
.area h3{font-size:21px;transition:color .2s}
.area p{font-size:13.5px;color:var(--ink-soft)}
.area .go{margin-top:auto;font-size:13px;color:var(--green);display:inline-flex;gap:4px;align-items:center}
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative}
.flow::before{content:"";position:absolute;left:8%;right:8%;top:22px;border-top:1.5px dashed var(--line-strong)}
.fstep{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;padding:0 4px}
.fstep .ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--ink)}
.fstep:nth-child(1) .ring{background:var(--panel);border:1.5px dashed var(--green)}
.fstep:nth-child(3) .ring{background:#8CCBA6} .fstep:nth-child(4) .ring{background:#4F9E77;color:#fff}
.fstep:nth-child(5) .ring{background:var(--green);color:#fff} .fstep:nth-child(6) .ring{background:var(--ink);color:var(--leaf)}
.fstep:nth-child(2) .ring{background:var(--leaf)}
.fstep b{font-size:14px} .fstep span{font-size:12.5px;color:var(--ink-soft);line-height:1.35}
.launch{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;border:1.5px solid var(--green);border-radius:var(--r-m);padding:18px 20px;background:#fff}
.datebox{width:72px;height:72px;border-radius:14px;background:var(--green);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.datebox b{font-family:var(--display);font-size:28px;font-weight:500}
.datebox span{font-size:12px;color:#F1F7F2;margin-top:4px;letter-spacing:.04em}
.datebox.dark{background:var(--ink)}
.launch h3{font-size:26px}

/* Matchmaking */
.results{display:flex;flex-direction:column;gap:12px}
.result{display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:start;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r-m);background:#fff;transition:border-color .2s,box-shadow .25s}
.result:hover{border-color:var(--line-strong);box-shadow:0 10px 26px -18px rgba(21,50,43,.35)}
.result .av{width:64px;height:64px;font-size:26px}
.result .who{display:flex;flex-direction:column;gap:4px;min-width:0}
.result .name{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.result .name b{font-size:17px}
.why{font-size:14.5px;line-height:1.5}
.why strong{font-weight:600}
.fit{font-size:12px;color:var(--green);display:flex;gap:6px;align-items:center;margin-top:2px}
.result .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.empty{padding:30px;text-align:center;border:1.5px dashed var(--line-strong);border-radius:var(--r-m);color:var(--ink-soft)}

/* Profiles */
.drop{display:flex;align-items:center;gap:16px;border:1.5px dashed var(--line-strong);border-radius:var(--r-m);background:var(--paper);padding:16px 20px;flex-wrap:wrap}
.drop svg{width:34px;height:34px;color:var(--green)}
.drop .t{flex:1;min-width:200px}
.drop .t b{display:block}
.prof-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.prof-head .av{width:76px;height:76px;font-size:32px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft)}
.prog .bar{width:180px;max-width:40vw;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .8s var(--ease)}
.persp{border:1.5px solid var(--line);color:var(--muted);background:#fff}
.persp[aria-pressed="true"].art{background:var(--art-bg);border-color:var(--art);color:var(--ink)}
.persp[aria-pressed="true"].sci{background:var(--sci-bg);border-color:var(--sci);color:var(--ink)}
.persp[aria-pressed="true"].tech{background:var(--tech-bg);border-color:var(--tech);color:var(--ink)}
.persp[aria-pressed="true"].soc{background:var(--soc-bg);border-color:var(--soc);color:var(--ink)}
.skill{background:var(--mint);color:var(--ink)}
.skill.suggested{background:#fff;border:1.5px dashed var(--green);color:var(--green-deep);animation:pop .45s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kinds{display:flex;flex-direction:column;gap:8px}
.kind{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-s);background:#fff;font-size:14px;text-align:left}
.kind .dot{width:10px;height:10px;border-radius:50%;flex:none}

/* Events */
.ev-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.ev-grid>*,.ev>div{min-width:0}
.evlist{display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r-m);background:#fff}
.ev .datebox{width:64px;height:64px;background:var(--ink)}
.ev .datebox b{font-size:26px}
.ev.hl{border:1.5px solid var(--green)} .ev.hl .datebox{background:var(--green)}
.ev b{font-size:15.5px;display:block;line-height:1.3}
.ev small{color:var(--ink-soft);font-size:13px}
.live{border-radius:var(--r-m);overflow:hidden;background:var(--ink);color:#E4EFE7;display:flex;flex-direction:column}
.live .thumb{height:170px;background:linear-gradient(135deg,#5FB39A,#2F5D8A);position:relative;display:grid;place-items:center}
.live .thumb .play{width:64px;height:64px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center}
.live .thumb .badge{position:absolute;left:12px;top:12px;background:var(--paper);color:var(--ink);font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 12px}
.live .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.live h3{font-family:var(--text);font-size:17px;font-weight:600;color:#fff;letter-spacing:0}
.live p{font-size:14px;color:#C9DCD2}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec div{height:92px;border-radius:12px;display:flex;align-items:flex-end;padding:10px 12px;color:#fff;font-size:13.5px;font-weight:600}

/* Opportunities */
.opps{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opp{display:flex;flex-direction:column;gap:10px;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r-m);background:#fff}
.opp h3{font-size:24px}
.opp .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.opp .meta span{display:inline-flex;gap:6px;align-items:center}
.opp .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:auto}

/* Project space */
.space{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr) minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:#fff}
.col{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.col + .col{border-left:1px solid var(--line)}
.col.side{background:var(--paper)}
.colhead{display:flex;gap:10px;align-items:center;font-weight:600;color:var(--green);font-size:14px}
.colhead i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12.5px}
.member{display:flex;gap:10px;align-items:center}
.member .av{width:38px;height:38px;font-size:15px}
.member b{display:block;font-size:14px;line-height:1.25}
.member small{font-size:12.5px;color:var(--ink-soft)}
.chat{display:flex;flex-direction:column;gap:10px;flex:1;min-height:240px;max-height:340px;overflow-y:auto;padding-right:4px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .av{width:32px;height:32px;font-size:13px}
.bubble{background:var(--mint);border-radius:14px;padding:9px 12px;font-size:14px;max-width:100%}
.bubble.ai{background:var(--ink);color:#F1F7F2}
.bubble.ai b{color:var(--leaf);display:block;font-size:12.5px;margin-bottom:2px}
.bubble.me{background:var(--green);color:#fff}
.msg.mine{flex-direction:row-reverse}
.doc{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:13.5px}
.doc svg{color:var(--tech)}
.check{font-size:12px;color:var(--green);display:flex;gap:5px;align-items:center}
.composer{display:flex;gap:8px;align-items:center;border:1.5px solid var(--green);border-radius:999px;padding:4px 4px 4px 16px;background:#fff}
.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;padding:8px 0}
.composer button{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.quota{display:flex;align-items:baseline;gap:10px}
.quota b{font-family:var(--display);font-size:52px;font-weight:500;line-height:.9;font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:62%;background:var(--green);border-radius:5px;transition:width .6s var(--ease)}
.feat{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.feat svg{color:var(--green);margin-top:2px}
.feat b{display:block;font-size:14px}
.goal{font-size:11px;font-weight:600;color:var(--art-ink);background:var(--art-bg);border-radius:999px;padding:2px 9px;margin-left:4px;vertical-align:1px}

/* Outcomes */
.outcome{display:grid;grid-template-columns:220px 1fr;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:#fff}
.outcome .vis{background:var(--mint);display:grid;place-items:center;padding:16px}
.outcome .body{padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.outcome h3{font-size:32px}
.similar{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:12px;padding:10px 14px;font-size:14px}
.similar svg{color:var(--art)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini{border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;background:#fff;display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left}
.mini b{font-size:16px}

/* Membership */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tier{border:1px solid var(--line);border-radius:var(--r-m);background:#fff;padding:22px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.tier::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--c)}
.tier .for{font-size:12.5px;font-weight:600;color:var(--green)}
.tier h3{font-size:36px}
.tier .price{color:var(--ink-soft);font-size:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tier ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:14px}
.tier li{display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:baseline}
.tier li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);transform:translateY(-1px)}
.tier .btn{margin-top:auto;align-self:flex-start}
.reasons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;border-top:1px solid var(--line);padding-top:18px}
.reasons h3{font-size:22px;margin-bottom:4px}
.reasons p{font-size:14px;color:var(--ink-soft)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#F1F7F2;padding:12px 18px;border-radius:14px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease);z-index:50;max-width:min(520px,calc(100vw - 32px));display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:var(--leaf);flex:none}

footer.foot{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer.foot .inner{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:20px}


/* Ezencia band: felixrohde.com CI (Oct 2026). Night sea fading into abyss, one quiet horizon, foam type in Geist. */
.ez{--night:#0B1420;--abyss:#050A10;--foam:#FFFFFF;--foam-2:rgba(255,255,255,.86);--foam-3:rgba(255,255,255,.66);--hair:rgba(255,255,255,.22);--ink:#0E1A24;
  position:relative;overflow:hidden;color:var(--foam-3);font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;isolation:isolate;
  background:linear-gradient(180deg,var(--night) 0%,#08111B 46%,var(--abyss) 100%)}
.ez::before{content:"";position:absolute;right:-10%;top:-30%;width:70%;height:90%;z-index:-1;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%,rgba(191,224,242,.16),rgba(11,74,111,.16) 45%,transparent 72%)}
.ez::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;z-index:-1;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14) 30%,rgba(255,255,255,.34) 72%,transparent)}
.ez ::selection{background:#BFE0F2;color:var(--ink)}
.ez .inner{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px 64px;align-items:end;padding-block:72px 32px}
.ez-mark{display:inline-flex;align-items:center;gap:10px;color:var(--foam);text-decoration:none;font-weight:600;font-size:17px;letter-spacing:-.01em}
.ez-mark img{width:28px;height:28px}
.ez-claim{margin-top:28px;font-family:inherit;font-weight:640;font-size:clamp(40px,6vw,76px);line-height:.97;letter-spacing:-.042em;color:var(--foam);text-wrap:balance}
.ez-side{display:flex;flex-direction:column;gap:16px;font-size:15px;line-height:1.55;max-width:40ch}
.ez-side b{color:var(--foam);font-weight:500}
.ez-pill{align-self:flex-start;display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:0 22px;border-radius:999px;background:var(--foam);color:var(--ink);font-weight:600;font-size:15.5px;letter-spacing:-.005em;text-decoration:none;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.ez-pill svg{width:18px;height:18px}
.ez-pill:hover{transform:translateY(-1px);box-shadow:0 14px 28px -16px rgba(5,10,16,.6)}
.ez-pill:focus-visible{outline:2px solid var(--foam);outline-offset:3px;box-shadow:0 0 0 5px rgba(14,26,36,.55)}
.ez-base{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;border-top:1px solid var(--hair);padding-top:18px;font-size:14px;line-height:1.6}
.ez-base a{color:var(--foam-2);text-decoration:none}
.ez-base a:hover{text-decoration:underline;text-underline-offset:3px}
@media (max-width:720px){.ez .inner{grid-template-columns:1fr;padding-block:56px 28px}.ez::before{width:120%;right:-40%}}

.lang{display:flex;gap:2px;flex:none;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.lang button{min-width:36px;padding:5px 9px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);transition:background .2s,color .2s}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ez-claim-link{color:inherit;text-decoration:none}
.ez-claim-link:hover{color:#DCEEF8}
/* Responsive */
@media (max-width:1080px){
  .shell{display:flex;flex-direction:column;gap:18px;padding-block:22px 48px}
  .guide{display:contents}
  .guide h1{order:1} .guide .lede{order:2} .screen{order:3;width:100%;max-width:100%} .guide .steps{order:4} .guide .try{order:5} .guide .guide-foot{order:6}
  .guide h1{font-size:40px}
  .guide .lede{max-width:60ch}
  .areas{grid-template-columns:repeat(3,minmax(0,1fr))}
  .area{border-right:0;margin-right:0;padding-right:12px;border-bottom:1px solid var(--line)}
  .space{grid-template-columns:1fr}
  .col + .col{border-left:0;border-top:1px solid var(--line)}
  .chat{max-height:none}
}
@media (max-width:720px){
  .me>span:first-child{display:none}
  .brand{margin-right:auto}
  .brand-name{font-size:19px}
  .lang button{min-width:32px;padding:5px 7px}
  .hero h2{font-size:38px;hyphens:manual;-webkit-hyphens:manual}
  .brand-sub{display:none}
  .appbar .inner{flex-wrap:wrap;gap:8px 12px;padding-block:8px}
  .nav{order:3;flex-basis:100%}
  .view{padding:18px}
  .hero{padding:26px 20px 22px;min-height:300px}
  .hero svg.art{width:110%;right:-40%;top:-20px;opacity:.75}
  .areas{grid-template-columns:1fr 1fr}
  .area:last-child{grid-column:1/-1}
  .flow{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:18px}
  .flow::before{display:none}
  .launch{grid-template-columns:auto 1fr}
  .launch .btn{grid-column:1/-1;justify-self:start}
  .result{grid-template-columns:48px 1fr;gap:12px;padding:14px}
  .result .av{width:48px;height:48px;font-size:20px}
  .result .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
  .two,.opps,.minis,.tiers,.reasons,.ev-grid{grid-template-columns:1fr}
  .outcome{grid-template-columns:1fr}
  .outcome .vis{height:160px}
  .screen-bar em{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .node-pulse{animation:none!important}
}
.node-pulse{animation:pulse 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
</style>

/* ---------- Guide ---------- */
function renderGuide(v){
 const i=VIEWS.indexOf(v),prev=VIEWS[i-1],next=VIEWS[i+1];
 $("#guide").innerHTML=`
  <h1${L(v.title).length>18?' style="font-size:clamp(34px,3.2vw,44px)"':""}>${esc(L(v.title))}</h1>
  <p class="lede">${esc(L(v.lede))}</p>
  <div class="steps">${L(v.steps).map((s,n)=>`<div class="step"><i>${n+1}</i><div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div></div>`).join("")}</div>
  <div class="try">${ic("eye")}<span><b>${t("tryLabel")}</b> ${esc(L(v.tryit))}</span></div>
  <div class="guide-foot">
   <div class="tourbar"><span class="count">${t("tour")(i+1,VIEWS.length)}</span>
    <button class="btn btn-ghost" data-go="${prev?prev.id:""}" ${prev?"":"disabled"} aria-label="${esc(t("prev"))}">${ic("back")}</button>
    ${next?`<button class="btn btn-dark" data-go="${next.id}">${esc(t("next")(L(next.nav)))} ${ic("arrow")}</button>`:`<button class="btn btn-dark" data-go="home">${t("restart")} ${ic("arrow")}</button>`}</div>
   <button class="btn btn-line" id="fb-guide" style="align-self:flex-start">${ic("chat")} ${t("comment")}</button>
   <span class="feedback-note" id="fb-note">${t("fbNote")}</span>
  </div>`;
}

/* ---------- Static text, language switch, Ezencia links ---------- */
function applyStatic(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-t]").forEach(el=>{el.textContent="";el.insertAdjacentHTML("afterbegin",t(el.dataset.t));});
 document.querySelectorAll("[data-t-html]").forEach(el=>{el.innerHTML=t(el.dataset.tHtml);});
 document.querySelectorAll("[data-t-aria]").forEach(el=>el.setAttribute("aria-label",t(el.dataset.tAria)));
 document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
 document.querySelectorAll(".ez-link").forEach(a=>a.href="https://felixrohde.com/?lang="+lang);
 $("#nav").innerHTML=VIEWS.map(v=>`<button data-go="${v.id}">${esc(L(v.nav))}</button>`).join("");
}
function setLang(l){
 if(!LANGS.includes(l)||l===lang)return;
 const other=T[lang].defaultQuery;
 lang=l;
 if(S.query===other)S.query=t("defaultQuery");
 try{localStorage.setItem("ase-lang",l);}catch(e){}
 try{const u=new URL(location.href);u.searchParams.set("lang",l);history.replaceState(null,"",u.pathname+u.search+u.hash);}catch(e){}
 applyStatic();
 go(current,{keepScroll:true,noAnim:true});
}

/* ---------- Router ---------- */
let current="home";
function go(target,opts){
 if(!target)return;
 const [id,sub]=String(target).split(":");
 if(!byId[id])return;
 if(sub){if(id==="opportunities")S.oppTab=sub;if(id==="matchmaking")S.filter=sub;}
 current=id;
 const v=byId[id];
 const nav=$("#nav");
 nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id?"page":"false"));
 const cur=nav.querySelector(`[data-go="${id}"]`);if(cur){nav.scrollTo({left:Math.max(0,cur.offsetLeft-nav.clientWidth/2+cur.offsetWidth/2),behavior:"smooth"});}
 $("#screen-title").textContent=L(v.win);
 renderGuide(v);
 render(!(opts&&opts.noAnim));
 try{history.replaceState(null,"",location.pathname+location.search+"#"+id);}catch(e){}
 if(!opts||!opts.keepScroll){const top=document.querySelector(".shell").getBoundingClientRect().top+window.scrollY-90;if(window.scrollY>top)window.scrollTo({top:Math.max(0,top),behavior:"smooth"});}
}
function render(animate){
 const el=$("#view");
 el.innerHTML=R[current]();
 if(animate){el.classList.remove("enter");void el.offsetWidth;el.classList.add("enter");}
 if(current==="space"){const c=$("#chat");if(c)c.scrollTop=c.scrollHeight;}
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
 const lb=e.target.closest("[data-lang]");if(lb){setLang(lb.dataset.lang);return;}
 const g=e.target.closest("[data-go]");
 if(g){e.preventDefault();if(g.dataset.go)go(g.dataset.go);return;}
 const el=e.target;
 const f=el.closest("[data-filter]");if(f){S.filter=f.dataset.filter;render();return;}
 const rq=el.closest("[data-request]");if(rq){S.requested[rq.dataset.request]=true;render();toast(t("tRequested"));return;}
 const pt=el.closest("[data-ptab]");if(pt){S.profTab=pt.dataset.ptab;render();return;}
 const br=el.closest("[data-bring]");if(br){const k=br.dataset.bring;S.bring[k]=!S.bring[k];render();return;}
 const et=el.closest("[data-etab]");if(et){S.evTab=et.dataset.etab;render();return;}
 const ot=el.closest("[data-otab]");if(ot){S.oppTab=ot.dataset.otab;render();return;}
 const mb=el.closest("[data-member]");if(mb){toast(t("tMember")(t("tiers")[+mb.dataset.member][1]));return;}
 if(el.closest("#suggest")){S.suggesting=true;render();return;}
 if(el.closest("#confirm-skills")){S.extraSkills=3;S.suggesting=false;S.progress=95;render();toast(t("tSkills"));return;}
 if(el.closest("#discard-skills")){S.suggesting=false;render();return;}
 if(el.closest("#seat")){S.seat=!S.seat;render();if(S.seat)toast(t("tSeat"));return;}
 if(el.closest("#adopt")){S.adopted=true;render();toast(t("tAdopt"));return;}
 if(el.closest("#interest")){S.interest=true;render();toast(t("tInterest"));return;}
 if(el.closest("[data-share]")){go("outcomes");toast(t("tShared"));return;}
 if(el.closest("#fb-guide")||el.closest("#fb-ribbon")){openFeedback();return;}
});
document.addEventListener("submit",e=>{
 e.preventDefault();
 const f=e.target;
 if(f.id==="home-search"){const v=$("#q-home").value.trim();if(v)S.query=v;S.filter="all";go("matchmaking");return;}
 if(f.id==="mm-search"){const v=$("#q-mm").value.trim();if(v)S.query=v;render();return;}
 if(f.id==="oc-search"){toast(t("tOcSearch"));return;}
 if(f.id==="composer"){
  const v=$("#msg").value.trim();if(!v)return;
  S.msgs.push({mine:true,t:v});render();
  setTimeout(()=>{S.msgs.push({ai:true,reply:true});S.quota=61;if(current==="space")render();},900);
 }
});

/* ---------- Feedback via claude.ai comments, Google Doc elsewhere ---------- */
const FEEDBACK_DOC="https://docs.google.com/document/d/1jFCp0H6xiPv2NsNr3CpyDCC4AROZPMLV4O9V42jxRS8/edit";
let commentsApi=null;
(async()=>{try{commentsApi=window.claude&&window.claude.use?await window.claude.use("comments"):null;}catch(e){commentsApi=null;}})();
async function openFeedback(){
 const note=$("#fb-note");
 if(!commentsApi){
  const w=window.open(FEEDBACK_DOC,"_blank","noopener");
  if(!w&&note)note.innerHTML=t("fbOpen").replace("{u}",FEEDBACK_DOC);
  return;
 }
 try{
  const r=await commentsApi.openComposer({element:$("#view")});
  if(!r||!r.opened)toast(t("toastFocus"));
 }catch(e){toast(t("toastNoComments"));}
}

/* ---------- Boot ---------- */
applyStatic();
let start="home";
const h=(location.hash||"").replace("#","");
if(byId[h])start=h;
go(start,{keepScroll:true});
window.addEventListener("hashchange",()=>{const k=(location.hash||"").replace("#","");if(byId[k]&&k!==current)go(k);});
})();
</script>
